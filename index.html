<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>@RobloxGuide</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;900&display=swap">
<style>
  :root {
    --bg: #2ecfd1;
    --name: #f5e94a;
    --text: #ffffff;
    --btn: #3cff2a;
    --btn-border: #d63a3a;
    --btn-text: #111111;
    --cta-bg: #ffffff;
    --cta-text: #111111;
    --chip: rgba(255,255,255,.35);
    --footer: rgba(255,255,255,.9);
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1fb2b4; } }
  :root[data-theme="dark"] { --bg: #1fb2b4; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: "Nunito", "Segoe UI", system-ui, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
  }
  .top {
    width: 100%;
    max-width: 560px;
    display: flex;
    justify-content: space-between;
    padding: 18px 20px 0;
  }
  .chip {
    width: 52px; height: 52px; border-radius: 50%;
    background: var(--chip);
    display: grid; place-items: center;
    color: var(--text); font-size: 22px; font-weight: 900;
    border: 0; cursor: pointer;
  }
  .chip:focus-visible { outline: 3px solid var(--name); outline-offset: 2px; }
  main {
    width: 100%;
    max-width: 560px;
    padding: 60px 20px 40px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    flex: 1;
  }
  .avatar {
    width: 130px; height: 130px; border-radius: 50%;
    object-fit: cover;
    border: 5px solid #ffffff;
    box-shadow: 0 8px 24px rgba(0,0,0,.18);
  }
  h1 {
    margin: 36px 0 12px;
    font-size: 40px;
    font-weight: 900;
    color: var(--name);
    letter-spacing: -.5px;
  }
  .bio {
    margin: 0 0 56px;
    font-size: 24px;
    font-weight: 600;
    line-height: 1.35;
    max-width: 30ch;
  }
  .links { width: 100%; display: flex; flex-direction: column; gap: 34px; }
  .link {
    position: relative;
    display: flex; align-items: center;
    width: 100%;
    min-height: 100px;
    padding: 14px 56px 14px 18px;
    background: linear-gradient(180deg, #7dff5a 0%, #2bff12 55%, #17d900 100%);
    color: var(--btn-text);
    border: 5px solid var(--btn-border);
    border-radius: 30px;
    text-decoration: none;
    font-size: 27px;
    font-weight: 900;
    letter-spacing: .3px;
    text-shadow: 0 1px 0 rgba(255,255,255,.6);
    overflow: hidden;
    box-shadow:
      0 0 0 4px #ffffff,
      0 0 22px 6px rgba(60,255,42,.9),
      0 0 46px 10px rgba(255,235,60,.55),
      0 10px 0 #a32222;
    animation: pulse 1.6s ease-in-out infinite;
  }
  .link::after {
    content: "";
    position: absolute; inset: 0;
    background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.85) 50%, transparent 70%);
    transform: translateX(-120%);
    animation: shine 2.4s ease-in-out infinite;
    pointer-events: none;
  }
  .link:nth-child(2) { animation-delay: .8s; }
  .link:nth-child(2)::after { animation-delay: 1.2s; }
  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.045);
      box-shadow:
        0 0 0 4px #ffffff,
        0 0 34px 12px rgba(60,255,42,1),
        0 0 70px 20px rgba(255,235,60,.75),
        0 10px 0 #a32222; }
  }
  @keyframes shine { 0%, 35% { transform: translateX(-120%); } 65%, 100% { transform: translateX(120%); } }
  @media (prefers-reduced-motion: reduce) { .link, .link::after { animation: none; } }
  .link:hover { filter: brightness(1.08); }
  .link:focus-visible { outline: 3px solid var(--name); outline-offset: 3px; }
  .link:active { transform: translateY(6px); box-shadow: 0 0 0 4px #ffffff, 0 4px 0 #a32222; animation: none; }
  .link .icon {
    flex: 0 0 76px; width: 76px; height: 76px;
    object-fit: contain;
    filter: drop-shadow(0 3px 4px rgba(0,0,0,.3));
    margin-right: 12px;
    animation: bob 1.2s ease-in-out infinite;
  }
  @keyframes bob { 0%,100% { transform: translateY(0) rotate(-6deg); } 50% { transform: translateY(-5px) rotate(6deg); } }
  .link .label { flex: 1; text-align: center; }
  .link .more {
    position: absolute; right: 18px; top: 50%; transform: translateY(-50%);
    width: 6px;
    display: flex; flex-direction: column; gap: 5px;
  }
  .link .more i { width: 6px; height: 6px; border-radius: 50%; background: var(--btn-text); display: block; }
  .cta {
    margin-top: 110px;
    padding: 20px 34px;
    background: var(--cta-bg);
    color: var(--cta-text);
    border-radius: 999px;
    font-size: 22px;
    font-weight: 700;
    text-decoration: none;
    box-shadow: 0 6px 18px rgba(0,0,0,.12);
  }
  .cta:focus-visible { outline: 3px solid var(--name); outline-offset: 3px; }
  footer {
    color: var(--footer);
    font-size: 16px;
    line-height: 1.7;
    text-align: center;
    padding: 0 20px 28px;
  }
  footer a { color: inherit; text-decoration: none; }
  @media (max-width: 400px) {
    h1 { font-size: 32px; }
    .bio { font-size: 20px; }
    .link { font-size: 20px; min-height: 78px; }
    .cta { font-size: 18px; margin-top: 70px; }
  }

  /* Epic background */
  body {
    background:
      radial-gradient(circle at 20% 15%, rgba(255,255,255,.28), transparent 40%),
      radial-gradient(circle at 80% 85%, rgba(0,255,190,.35), transparent 45%),
      linear-gradient(160deg, #0f7f95 0%, #21c7d0 45%, #0b5f8f 100%);
    background-attachment: fixed;
    position: relative;
    overflow-x: hidden;
  }
  .sky {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, rgba(80,240,255,.35), transparent 60%);
    animation: breathe 6s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: .7; } 50% { opacity: 1; } }
  .sky .rays {
    position: absolute; left: 50%; top: -20%; width: 180vmax; height: 180vmax;
    transform: translateX(-50%);
    background: repeating-conic-gradient(from 0deg, rgba(255,255,255,.10) 0deg 6deg, transparent 6deg 18deg);
    border-radius: 50%;
    animation: spin 80s linear infinite;
    mask-image: radial-gradient(circle, rgba(0,0,0,.9), transparent 55%);
    -webkit-mask-image: radial-gradient(circle, rgba(0,0,0,.9), transparent 55%);
  }
  @keyframes spin { to { transform: translateX(-50%) rotate(360deg); } }
  .cube, .coin, .star {
    position: absolute; opacity: .85; will-change: transform;
    animation: floaty var(--d, 12s) ease-in-out infinite;
    animation-delay: var(--dl, 0s);
  }
  .cube {
    width: var(--s, 60px); height: var(--s, 60px);
    background: linear-gradient(145deg, #7ef5ff, #2b8bff 60%, #123f9e);
    border-radius: 12px;
    box-shadow: inset -8px -8px 0 rgba(0,0,0,.18), inset 6px 6px 0 rgba(255,255,255,.35), 0 12px 30px rgba(0,40,90,.35);
    transform: rotate(var(--r, 15deg));
  }
  .cube::after {
    content: ""; position: absolute; inset: 30%;
    background: #0d2a66; border-radius: 4px;
    box-shadow: inset 0 0 0 4px #7ef5ff;
  }
  .coin {
    width: var(--s, 50px); height: var(--s, 50px);
    background: linear-gradient(145deg, #fff27a, #f5c400 60%, #b98400);
    clip-path: polygon(30% 0, 70% 0, 100% 30%, 100% 70%, 70% 100%, 30% 100%, 0 70%, 0 30%);
    filter: drop-shadow(0 10px 18px rgba(120,80,0,.4));
  }
  .coin::after {
    content: ""; position: absolute; inset: 32%;
    background: #fff9c9; transform: rotate(45deg);
    box-shadow: inset 0 0 0 5px #b98400;
  }
  .star {
    width: 6px; height: 6px; border-radius: 50%; background: #fff;
    box-shadow: 0 0 10px 3px rgba(255,255,255,.8);
    animation-name: twinkle; animation-duration: var(--d, 3s);
  }
  @keyframes floaty {
    0%,100% { transform: translateY(0) rotate(var(--r, 0deg)); }
    50% { transform: translateY(-28px) rotate(calc(var(--r, 0deg) + 12deg)); }
  }
  @keyframes twinkle { 0%,100% { opacity: .2; transform: scale(.6); } 50% { opacity: 1; transform: scale(1.3); } }
  @media (prefers-reduced-motion: reduce) { .sky, .sky *, .cube, .coin, .star { animation: none; } }
  .top, main { position: relative; z-index: 1; }
</style>
</head>
<body>
